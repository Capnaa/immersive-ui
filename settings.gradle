pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    // Auto-provisions the Java 25 toolchain that Minecraft 26.3 requires
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'immersiveui'

include 'common'
include 'fabric'
// NeoForge has not been ported to 26.3 yet
// include 'neoforge'
