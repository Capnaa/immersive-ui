plugins {
    id 'net.neoforged.moddev'
}

// "Vanilla only" setup: gives the common module the Minecraft classes to compile against.
// The loader modules compile this module's sources themselves (see fabric/build.gradle).
neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.3'

    compileOnly("maven.modrinth:RH2KUdKJ:$rootProject.shatterlib_version") {
        transitive = false
    }
    // ShatterLib's config classes expose JSON5 types in their signatures
    compileOnly 'de.marhali:json5-java:3.0.0'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
