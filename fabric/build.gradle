plugins {
    id 'net.fabricmc.fabric-loom'
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation("maven.modrinth:RH2KUdKJ:$rootProject.shatterlib_version") {
        transitive = false
    }
    // ShatterLib's config classes expose JSON5 types in their signatures
    compileOnly 'de.marhali:json5-java:3.0.0'

    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

loom {
    // Client-only mod: use the client run config only.
    runs {
        client {
            client()
        }
    }
}

// The common module is compiled as part of this one, against Minecraft as provided by Loom.
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

def resourceTargets = ['fabric.mod.json']
def replaceProperties = [
        mod_version: mod_version, mod_group: mod_group, mod_name: mod_name,
        mod_id     : mod_id, mod_description: mod_description, mod_authors: mod_authors,
        mod_license: mod_license, mod_tracker: mod_tracker,
        minecraft_version: minecraft_version, java_version: java_version,
        shatterlib_min_version: shatterlib_min_version
]

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    inputs.properties replaceProperties

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
